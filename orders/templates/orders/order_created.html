{% extends "products/base.html" %}

{% block content %}
<div style="background: white; max-width: 600px; margin: 0 auto; padding: 40px 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h1 style="color: #2ecc71; font-size: 3em; margin: 0;">✅</h1>
    <h2>سفارش شما با موفقیت ثبت شد!</h2>
    <p>شماره پیگیری سفارش شما: <strong>{{ order.id }}</strong></p>
    <p>از خرید شما سپاسگزاریم. به زودی برای ارسال با شما تماس خواهیم گرفت.</p>
    <a href="{% url 'payment_process' order.id %}" style="display: inline-block; margin-top: 20px; background-color: #2ecc71; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 1.1em;">پرداخت آنلاین فاکتور 💳</a>
</div>
{% endblock %}
