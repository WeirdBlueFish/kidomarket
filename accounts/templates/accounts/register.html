{% extends "products/base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #2c3e50;">ثبت‌نام در فروشگاه</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; background: #3498db; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">ثبت‌نام</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">حساب کاربری دارید؟ <a href="{% url 'login' %}">وارد شوید</a></p>
</div>
{% endblock %}
