{% extends "accounts/profile_base.html" %}

{% block profile_content %}
    <h2 style="color: #2c3e50; margin-top: 0; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px;">اطلاعات کاربری</h2>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
        <div style="background: #fdfefe; padding: 15px; border: 1px solid #ecf0f1; border-radius: 8px;">
            <span style="color: #7f8c8d; font-size: 0.9em;">نام کاربری:</span>
            <p style="margin: 5px 0 0 0; font-weight: bold; color: #2c3e50;">{{ request.user.username }}</p>
        </div>
        <div style="background: #fdfefe; padding: 15px; border: 1px solid #ecf0f1; border-radius: 8px;">
            <span style="color: #7f8c8d; font-size: 0.9em;">شماره تماس:</span>
            <p style="margin: 5px 0 0 0; font-weight: bold; color: #2c3e50;">{{ profile.phone|default:"ثبت نشده" }}</p>
        </div>
        <div style="grid-column: span 2; background: #fdfefe; padding: 15px; border: 1px solid #ecf0f1; border-radius: 8px;">
            <span style="color: #7f8c8d; font-size: 0.9em;">آدرس کامل:</span>
            <p style="margin: 5px 0 0 0; font-weight: bold; color: #2c3e50;">{{ profile.address|default:"ثبت نشده" }}</p>
        </div>
    </div>
    <h3 style="color: #2c3e50; margin-top: 40px; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px;">ویرایش اطلاعات</h3>
    <form method="post" style="display: flex; flex-direction: column; gap: 15px; max-width: 600px;">
        {% csrf_token %}
        <div style="display: flex; gap: 15px;">
            <input type="text" name="first_name" value="{{ request.user.first_name }}" placeholder="نام" style="flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7;">
            <input type="text" name="last_name" value="{{ request.user.last_name }}" placeholder="نام خانوادگی" style="flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7;">
        </div>
        <input type="text" name="phone" value="{{ profile.phone|default:'' }}" placeholder="شماره تماس (مثال: 09123456789)" style="padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7;">
        <textarea name="address" placeholder="آدرس کامل جهت ارسال سفارشات" rows="3" style="padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; resize: vertical;">{{ profile.address|default:'' }}</textarea>
        <button type="submit" style="background: #27ae60; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 150px;">ذخیره تغییرات</button>
    </form>
{% endblock %}
