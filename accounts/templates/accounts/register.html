{% extends "products/base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-12 mb-20 bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-8">ثبت‌نام در فروشگاه</h2>
    
    <!-- استایل‌دهی خودکار فیلدهای فرم جنگو -->
    <form method="post" class="[&>p]:mb-5 [&_label]:block [&_label]:font-bold [&_label]:text-slate-700 [&_label]:mb-2 [&_input]:w-full [&_input]:p-3 [&_input]:rounded-xl [&_input]:border [&_input]:border-gray-300 [&_input]:focus:border-blue-500 [&_input]:focus:ring-0 [&_input]:outline-none [&_input]:font-sans [&_input]:transition [&_span.helptext]:text-xs [&_span.helptext]:text-gray-400 [&_span.helptext]:mt-1 [&_span.helptext]:block">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="w-full mt-4 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl transition duration-300 shadow-sm">
            ثبت‌نام
        </button>
    </form>
    
    <p class="text-center mt-6 text-gray-500 text-sm">
        حساب کاربری دارید؟ 
        <a href="{% url 'accounts:login' %}" class="text-emerald-500 hover:text-emerald-600 font-bold transition">وارد شوید</a>
    </p>
</div>
{% endblock %}
