<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کی‌دو مارکت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- اضافه کردن فونت آیکون‌ها برای داشبورد -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-slate-100 font-sans flex h-screen overflow-hidden">

    <!-- پس زمینه تاریک برای سایدبار در موبایل -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden" onclick="toggleSidebar()"></div>

    <!-- سایدبار مدیریت -->
    <!-- کلاس‌های ریسپانسیو اضافه شد: در موبایل به صورت fixed می‌ماند و با translate مخفی می‌شود -->
    <aside id="sidebar" class="fixed lg:static top-0 right-0 z-30 w-64 bg-slate-900 text-white flex flex-col h-full shrink-0 transform translate-x-full lg:translate-x-0 transition-transform duration-300">
        <div class="h-16 flex items-center justify-between lg:justify-center px-4 lg:px-0 border-b border-slate-800">
            <h1 class="text-xl font-bold text-emerald-400">کی‌دو مارکت <span class="text-sm text-gray-400">| پنل</span></h1>
            <!-- دکمه بستن سایدبار در موبایل -->
            <button class="lg:hidden text-gray-400 hover:text-white" onclick="toggleSidebar()">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="{% url 'dashboard_home' %}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-chart-pie w-5"></i> پیشخوان
            </a>
            <a href="{% url 'dashboard_product_list' %}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-box-open w-5"></i> مدیریت محصولات
            </a>
            <a href="{% url 'dashboard_order_list' %}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-cart-shopping w-5"></i> مدیریت سفارشات
            </a>
            <a href="{% url 'dashboard_user_list' %}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-users w-5"></i> مدیریت کاربران
            </a>
            <a href="{% url 'dashboard_coupon_list' %}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-ticket w-5"></i> کدهای تخفیف
            </a>
            <a href="{% url 'dashboard_notification_list' %}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-bell w-5"></i> درخواست‌های موجودی
            </a>
            <a href="{% url 'dashboard_shipping_settings' %}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-truck-fast w-5"></i> تنظیمات ارسال
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <a href="/" class="flex items-center justify-center gap-2 w-full px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 rounded-lg transition text-sm">
                <i class="fa-solid fa-store"></i> مشاهده سایت
            </a>
        </div>
    </aside>

    <!-- بخش محتوای اصلی -->
    <main class="flex-1 flex flex-col h-full overflow-hidden w-full lg:w-auto">
        <!-- هدر بالای داشبورد -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 lg:px-8 shrink-0">
            <div class="flex items-center gap-3">
                <!-- دکمه همبرگری برای باز کردن سایدبار در موبایل -->
                <button class="lg:hidden text-slate-600 hover:text-blue-600 focus:outline-none" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
                <div class="text-slate-800 font-bold hidden sm:block">
                    امروز: <span id="current-date" class="text-blue-600"></span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm font-bold text-slate-600">مدیر: {{ request.user.username }}</span>
                <a href="{% url 'accounts:logout' %}" class="text-red-500 hover:text-red-700 transition">
                    <i class="fa-solid fa-power-off text-lg"></i>
                </a>
            </div>
        </header>

        <!-- کانتینر صفحات داخلی -->
        <!-- پدینگ در موبایل کمتر شد (p-4 به جای p-8) تا محتوا بهتر جا شود -->
        <div class="flex-1 overflow-y-auto p-4 lg:p-8">
            {% block dashboard_content %}
            {% endblock %}
        </div>
    </main>

    <script>
        // اسکریپت نمایش تاریخ شمسی
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('fa-IR');

        // اسکریپت باز و بسته کردن سایدبار در موبایل
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            // جابجایی سایدبار (ورود و خروج)
            sidebar.classList.toggle('translate-x-full');
            
            // نمایش یا عدم نمایش پس‌زمینه تاریک
            overlay.classList.toggle('hidden');
        }
    </script>
</body>
</html>
