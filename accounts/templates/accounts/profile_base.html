{% extends "products/base.html" %}

{% block content %}
<div class="flex flex-col md:flex-row max-w-6xl mx-auto my-8 md:my-12 gap-6 px-4 sm:px-0">
    
    <!-- سایدبار -->
    <div class="w-full md:w-72 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 shrink-0 h-fit">
        <div class="text-center border-b-2 border-gray-100 pb-5 mb-5">
            <h3 class="m-0 text-xl font-bold text-slate-800">{{ request.user.get_full_name|default:request.user.username }}</h3>
            <span class="text-sm text-gray-500 mt-1 block">داشبورد کاربری</span>
        </div>
        
        <div class="flex flex-col gap-2">
            <a href="{% url 'accounts:profile' %}" class="block p-3.5 bg-slate-50 hover:bg-blue-500 text-slate-700 hover:text-white rounded-xl font-bold transition duration-300">👤 اطلاعات شخصی</a>
            <a href="{% url 'accounts:profile_orders' %}" class="block p-3.5 bg-slate-50 hover:bg-blue-500 text-slate-700 hover:text-white rounded-xl font-bold transition duration-300">📦 سفارشات من</a>
            <a href="{% url 'accounts:profile_children' %}" class="block p-3.5 bg-slate-50 hover:bg-blue-500 text-slate-700 hover:text-white rounded-xl font-bold transition duration-300">👶 مشخصات فرزندان</a>
        </div>
    </div>

    <!-- باکس محتوای متغیر -->
    <div class="flex-1 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        {% block profile_content %}
        {% endblock %}
    </div>

</div>
{% endblock %}
