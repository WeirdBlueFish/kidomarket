<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کی‌دو مارکت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- اضافه کردن فونت آیکون‌ها برای داشبورد -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-slate-100 font-sans flex h-screen overflow-hidden">

    <!-- سایدبار مدیریت -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col h-full shrink-0">
        <div class="h-16 flex items-center justify-center border-b border-slate-800">
            <h1 class="text-xl font-bold text-emerald-400">کی‌دو مارکت <span class="text-sm text-gray-400">| پنل مدیریت</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-chart-pie"></i> پیشخوان
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-box-open"></i> مدیریت محصولات
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-cart-shopping"></i> سفارشات <span class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full mr-auto">۳ جدید</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 text-gray-300 hover:text-white rounded-xl font-bold transition">
                <i class="fa-solid fa-users"></i> کاربران
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <a href="/" class="flex items-center justify-center gap-2 w-full px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 rounded-lg transition text-sm">
                <i class="fa-solid fa-store"></i> مشاهده سایت
            </a>
        </div>
    </aside>

    <!-- بخش محتوای اصلی -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- هدر بالای داشبورد -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 shrink-0">
            <div class="text-slate-800 font-bold">
                امروز: <span id="current-date" class="text-blue-600"></span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm font-bold text-slate-600">مدیر: {{ request.user.username }}</span>
                <a href="{% url 'accounts:logout' %}" class="text-red-500 hover:text-red-700 transition">
                    <i class="fa-solid fa-power-off text-lg"></i>
                </a>
            </div>
        </header>

        <!-- کانتینر صفحات داخلی -->
        <div class="flex-1 overflow-y-auto p-8">
            {% block dashboard_content %}
            {% endblock %}
        </div>
    </main>

    <script>
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('fa-IR');
    </script>
</body>
</html>
