{% extends "products/base.html" %}

{% block css %}
<style>
    .checkout-container { background: white; max-width: 600px; margin: 0 auto; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-family: Tahoma; }
    .btn-submit { background-color: #2ecc71; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; width: 100%; margin-top: 10px;}
</style>
{% endblock %}

{% block content %}
<div class="checkout-container">
    <h2>ثبت نهایی سفارش 📦</h2>
    <p>لطفاً مشخصات خود را با دقت وارد کنید.</p>
    
    <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    <!-- این بخش اضافه شد تا ارورها رو نشون بده -->
                    {% if field.errors %}
                        <div style="color: red; font-size: 0.85em; margin-top: 5px;">
                            {{ field.errors|striptags }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn-submit">ثبت نهایی و دریافت فاکتور</button>
        </form>
</div>
{% endblock %}
