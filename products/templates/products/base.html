<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه لباس کودک</title>
    
    <!-- إضافة خط Vazirmatn الاحترافي -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- مكتبة Tailwind CSS عبر CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block css %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- نوار ناوبری اصلی سایت -->
    <nav class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                
                <!-- بخش راست: دکمه منوی موبایل، لوگو و لینک‌های دسکتاپ -->
                <div class="flex items-center gap-4 md:gap-8">
                    
                    <!-- دکمه همبرگری موبایل -->
                    <button id="mobile-menu-btn" class="md:hidden text-slate-600 hover:text-emerald-500 text-2xl focus:outline-none transition">
                        <i class="fa-solid fa-bars"></i>
                    </button>

                    <a href="{% url 'product_list' %}" class="text-xl md:text-2xl font-bold text-emerald-500 flex items-center gap-2">
                        <span class="text-2xl md:text-3xl">🧸</span> کیدو مارکت
                    </a>
                    
                    <!-- لینک‌های دسکتاپ (در موبایل مخفی هستند) -->
                    <div class="hidden md:flex items-center gap-6">
                        <a href="{% url 'product_list' %}" class="text-slate-600 hover:text-emerald-500 font-bold transition">فروشگاه</a>
                        <!-- اگر برای فیلتر کردن از پارامتر در url استفاده می‌کنید می‌توانید لینک‌ها را تغییر دهید -->
                        <a href="{% url 'product_list' %}?gender=girl" class="text-slate-600 hover:text-pink-500 font-bold transition">دخترانه</a>
                        <a href="{% url 'product_list' %}?gender=boy" class="text-slate-600 hover:text-orange-500 font-bold transition">پسرانه</a>
                    </div>
                </div>
                
                <!-- بخش چپ: سبد خرید و حساب کاربری -->
                <div class="flex items-center gap-3 sm:gap-6">
                    <a href="{% url 'cart_detail' %}" class="relative p-2 text-slate-600 hover:text-emerald-500 transition group">
                        <i class="fa-solid fa-cart-shopping text-xl sm:text-2xl group-hover:scale-110 transition-transform"></i>
                        {% if cart|length > 0 %}
                            <span class="absolute top-0 right-0 -mt-1 -mr-2 flex h-5 w-5 sm:h-6 sm:w-6 items-center justify-center rounded-full bg-red-500 border-2 border-white text-white text-[10px] sm:text-xs font-bold shadow-sm">
                                {{ cart|length }}
                            </span>
                        {% endif %}
                    </a>
                    
                    <div class="w-px h-8 bg-gray-200 hidden sm:block"></div>
                    
                    {% if user.is_authenticated %}
                        <div class="flex items-center gap-1 sm:gap-2">
                            <a href="{% url 'accounts:profile' %}" class="flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-700 bg-slate-50 hover:bg-slate-100 border border-gray-200 px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl transition">
                                <i class="fa-regular fa-user text-base sm:text-lg text-blue-500"></i>
                                <span class="hidden sm:inline">{{ user.first_name|default:user.username }}</span>
                            </a>
                            <a href="{% url 'accounts:logout' %}" class="flex items-center justify-center text-xs sm:text-sm text-red-500 bg-red-50 hover:bg-red-500 hover:text-white px-3 py-2 sm:py-2.5 rounded-xl transition" title="خروج از حساب">
                                <i class="fa-solid fa-arrow-right-from-bracket text-base sm:text-lg"></i>
                            </a>
                        </div>
                    {% else %}
                        <a href="{% url 'accounts:login' %}" class="text-xs sm:text-sm font-bold text-white bg-blue-500 hover:bg-blue-600 px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl transition shadow-sm">
                            ورود <span class="hidden sm:inline">/ ثبت‌نام</span>
                        </a>
                    {% endif %}
                    
                </div>
            </div>
        </div>

        <!-- منوی کشویی موبایل (به صورت پیش‌فرض مخفی است) -->
        <div id="mobile-menu" class="hidden md:hidden bg-slate-50 border-t border-gray-100">
            <div class="flex flex-col px-4 pt-2 pb-4 space-y-2">
                <a href="{% url 'product_list' %}" class="block px-3 py-2.5 rounded-lg text-sm font-bold text-slate-700 hover:text-emerald-500 hover:bg-white border border-transparent hover:border-emerald-100 transition">🛍️ فروشگاه</a>
                <a href="{% url 'product_list' %}?gender=girl" class="block px-3 py-2.5 rounded-lg text-sm font-bold text-slate-700 hover:text-pink-500 hover:bg-white border border-transparent hover:border-pink-100 transition">👧 دخترانه</a>
                <a href="{% url 'product_list' %}?gender=boy" class="block px-3 py-2.5 rounded-lg text-sm font-bold text-slate-700 hover:text-orange-500 hover:bg-white border border-transparent hover:border-orange-100 transition">👦 پسرانه</a>
            </div>
        </div>
    </nav>

    <!-- اسکریپت باز و بسته کردن منوی موبایل -->
    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            const menu = document.getElementById('mobile-menu');
            const icon = this.querySelector('i');
            
            menu.classList.toggle('hidden');
            
            // تغییر آیکون همبرگری به ضربدر هنگام باز شدن
            if (menu.classList.contains('hidden')) {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            } else {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            }
        });
    </script>

    <!-- محتوى الصفحات الديناميكي -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}
        {% endblock %}
    </main>

    <!-- كود جافا سكريبت لتشغيل القائمة على الهواتف -->
    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
