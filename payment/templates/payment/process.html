<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درگاه پرداخت</title>
    
    <!-- فونت و Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 font-sans flex items-center justify-center min-h-screen px-4">

    <div class="bg-white w-full max-w-md p-8 md:p-10 rounded-2xl border-t-8 border-blue-600 shadow-xl text-center">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">درگاه پرداخت شبیه‌سازی‌شده</h2>
        <p class="text-gray-500 mb-6">فروشگاه لباس کودک 🧸</p>
        
        <div class="bg-slate-50 border border-gray-100 rounded-xl p-5 mb-6">
            <span class="text-gray-500 block mb-2">مبلغ پرداختی:</span>
            <strong class="text-2xl text-slate-800">{{ total_price }} تومان</strong>
        </div>
        
        <form method="post" class="flex flex-col sm:flex-row gap-3">
            {% csrf_token %}
            <button type="submit" name="pay" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 px-4 rounded-xl transition duration-300 shadow-sm">
                پرداخت موفق
            </button>
            <button type="submit" name="cancel" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 px-4 rounded-xl transition duration-300 shadow-sm">
                انصراف
            </button>
        </form>
    </div>

</body>
</html>
