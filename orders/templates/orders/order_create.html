{% extends "products/base.html" %}

{% block content %}
<div class="max-w-xl mx-auto mt-12 mb-20 bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
    <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">ثبت نهایی سفارش 📦</h2>
        <p class="text-gray-500">لطفاً مشخصات خود را با دقت وارد کنید.</p>
    </div>
    
    <!-- استایل‌دهی خودکار فیلدهای Input و Textarea فرم جنگو -->
    <form method="post" class="flex flex-col gap-5 [&_label]:block [&_label]:font-bold [&_label]:text-slate-700 [&_label]:mb-2 [&_input]:w-full [&_input]:p-3.5 [&_input]:rounded-xl [&_input]:border [&_input]:border-gray-300 [&_input]:focus:border-blue-500 [&_input]:focus:ring-0 [&_input]:outline-none [&_input]:transition [&_textarea]:w-full [&_textarea]:p-3.5 [&_textarea]:rounded-xl [&_textarea]:border [&_textarea]:border-gray-300 [&_textarea]:focus:border-blue-500 [&_textarea]:focus:ring-0 [&_textarea]:outline-none [&_textarea]:transition [&_textarea]:resize-y">
        {% csrf_token %}
        
        {% for field in form %}
            <div>
                <label>{{ field.label }}</label>
                {{ field }}
                
                <!-- نمایش ارورهای فیلد -->
                {% if field.errors %}
                    <div class="text-red-500 text-sm font-bold mt-2 px-1">
                        {{ field.errors|striptags }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-6 rounded-xl transition duration-300 shadow-sm text-lg">
            ثبت نهایی و دریافت فاکتور
        </button>
    </form>
</div>
{% endblock %}
