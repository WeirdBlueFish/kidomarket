{% extends "products/base.html" %}

{% block content %}
<div class="max-w-xl mx-auto mt-16 mb-24 bg-white p-10 md:p-12 rounded-2xl shadow-sm border border-gray-100 text-center">
    
    {% if success %}
        <span class="text-7xl block mb-6 drop-shadow-sm">✅</span>
        <h2 class="text-3xl font-bold text-emerald-600 mb-4">پرداخت با موفقیت انجام شد!</h2>
        <p class="text-gray-500 text-lg mb-8 leading-relaxed">سفارش شما تایید شد و به زودی ارسال می‌گردد.</p>
    {% else %}
        <span class="text-7xl block mb-6 drop-shadow-sm">❌</span>
        <h2 class="text-3xl font-bold text-red-500 mb-4">پرداخت ناموفق بود!</h2>
        <p class="text-gray-500 text-lg mb-8 leading-relaxed">تراکنش لغو شد. سفارش شما در سیستم ثبت شده اما نیازمند پرداخت است.</p>
    {% endif %}
    
    <a href="{% url 'product_list' %}" class="inline-block bg-blue-500 hover:bg-blue-600 text-white font-bold py-3.5 px-8 rounded-xl transition duration-300 shadow-sm">
        بازگشت به فروشگاه
    </a>
</div>
{% endblock %}
