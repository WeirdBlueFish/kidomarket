{% extends "accounts/profile_base.html" %}

{% block profile_content %}
    <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-gray-100 pb-4 mb-6 mt-0">اطلاعات کاربری</h2>
    
    <!-- نمایش اطلاعات با گرید ریسپانسیو -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-12">
        <div class="bg-slate-50 p-5 border border-gray-100 rounded-xl">
            <span class="text-sm text-gray-500">نام کاربری:</span>
            <p class="m-0 mt-1 font-bold text-slate-800 text-lg">{{ request.user.username }}</p>
        </div>
        
        <div class="bg-slate-50 p-5 border border-gray-100 rounded-xl">
            <span class="text-sm text-gray-500">شماره تماس:</span>
            <p class="m-0 mt-1 font-bold text-slate-800 text-lg">{{ profile.phone|default:"ثبت نشده" }}</p>
        </div>
        
        <div class="col-span-1 md:col-span-2 bg-slate-50 p-5 border border-gray-100 rounded-xl">
            <span class="text-sm text-gray-500">آدرس کامل:</span>
            <p class="m-0 mt-1 font-bold text-slate-800 text-lg">{{ profile.address|default:"ثبت نشده" }}</p>
        </div>
    </div>

    <h3 class="text-xl font-bold text-slate-800 border-b-2 border-gray-100 pb-4 mb-6">ویرایش اطلاعات</h3>
    
    <!-- فرم ویرایش اطلاعات -->
    <form method="post" class="flex flex-col gap-4 max-w-2xl">
        {% csrf_token %}
        
        <div class="flex flex-col md:flex-row gap-4">
            <input type="text" name="first_name" value="{{ request.user.first_name }}" placeholder="نام" class="flex-1 p-3.5 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-0 outline-none font-sans transition">
            <input type="text" name="last_name" value="{{ request.user.last_name }}" placeholder="نام خانوادگی" class="flex-1 p-3.5 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-0 outline-none font-sans transition">
        </div>
        
        <input type="text" name="phone" value="{{ profile.phone|default:'' }}" placeholder="شماره تماس (مثال: 09123456789)" class="w-full p-3.5 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-0 outline-none font-sans transition direction-ltr text-right">
        
        <textarea name="address" placeholder="آدرس کامل جهت ارسال سفارشات" rows="3" class="w-full p-3.5 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-0 outline-none font-sans transition resize-y">{{ profile.address|default:'' }}</textarea>
        
        <button type="submit" class="w-full md:w-auto self-start mt-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 px-8 rounded-xl transition shadow-sm">
            ذخیره تغییرات
        </button>
    </form>
{% endblock %}
