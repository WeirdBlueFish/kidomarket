{% extends "dashboard/dashboard_base.html" %}

{% block dashboard_content %}
<div class="flex flex-col md:flex-row justify-between md:items-center mb-8 gap-4 border-b border-gray-100 pb-4">
    <div>
        <h2 class="text-2xl font-bold text-slate-800">{{ title }}</h2>
    </div>
    <a href="{% url 'dashboard_coupon_list' %}" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-5 rounded-xl transition flex items-center gap-2">
        بازگشت به لیست ⮌
    </a>
</div>

<div class="bg-white p-6 md:p-8 rounded-3xl border border-gray-100 shadow-sm max-w-3xl mx-auto">
    <form method="post" class="flex flex-col gap-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="md:col-span-2">
                <label class="block text-sm font-bold text-slate-700 mb-2">کد تخفیف (مثال: YALDA):</label>
                {{ form.code }}
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">درصد تخفیف (۱ تا ۱۰۰):</label>
                {{ form.discount }}
            </div>
            <div class="flex items-center mt-6">
                {{ form.active }}
                <label class="text-sm font-bold text-slate-700 ml-2 mr-2">این کد فعال باشد</label>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">شروع اعتبار:</label>
                {{ form.valid_from }}
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">پایان اعتبار:</label>
                {{ form.valid_to }}
            </div>
        </div>
        
        <div class="mt-6 flex justify-end border-t border-gray-100 pt-6">
            <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-10 rounded-xl transition shadow-sm text-lg">
                ذخیره اطلاعات
            </button>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputs = document.querySelectorAll("form input[type='text'], form input[type='number'], form input[type='datetime-local']");
        inputs.forEach(input => {
            input.classList.add("w-full", "p-3.5", "rounded-xl", "border", "border-gray-300", "focus:border-blue-500", "focus:outline-none", "font-sans", "bg-slate-50", "transition", "text-left");
            input.setAttribute("dir", "ltr");
        });
        const checkboxes = document.querySelectorAll("form input[type='checkbox']");
        checkboxes.forEach(input => {
            input.classList.add("w-5", "h-5", "text-blue-600", "rounded", "focus:ring-blue-500");
        });
    });
</script>
{% endblock %}
